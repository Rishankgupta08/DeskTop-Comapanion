[package]
name = "openmate-cli"
version = "0.1.0"
edition = "2021"
authors = ["OpenMate Contributors"]
license = "MIT"
description = "OpenMate Plugin Authoring & Verification CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "serde", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
walkdir = "2"

