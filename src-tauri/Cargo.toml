[package]
name = "openmate"
version = "0.1.0"
description = "OpenMate — open-source AI desktop companion"
authors = ["OpenMate Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/openmate-app/openmate"

[lib]
# The `_lib` suffix is required to avoid symbol conflicts on Windows
# between the binary and library crate names (cargo issue #8519).
name = "openmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ─────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"

# ── Async runtime ──────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ──────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Local database (SQLite) [DR-006, ADR-006] ─────────────────────────────
# tokio-rusqlite 0.5.1 resolves rusqlite 0.31.0 internally.
# We add the same version here so `rusqlite::params!` etc. work in our code
# without a libsqlite3-sys link conflict (both sides unify to rusqlite 0.31).
# Do NOT use the `bundled` feature — tokio-rusqlite owns sqlite linkage.
rusqlite = "0.31"
tokio-rusqlite = "0.5"

# ── OS credential storage [DR-011, ADR-009] ────────────────────────────────
# `keyring` abstracts macOS Keychain & Windows Credential Manager.
keyring = "3"

# ── HTTP client for Gemini & Groq APIs [DR-027, C-004] ────────────────────────────
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
dotenvy = "0.15"

# ── Error handling ────────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ── Logging (local only, no telemetry) [DR-028] ───────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── State management ──────────────────────────────────────────────────────
once_cell = "1"

# ── Timestamp / UUID ─────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# ── Async trait support ──────────────────────────────────────────────────────
async-trait = "0.1"

# ── Base64 for multimodal image encoding ─────────────────────────────────────
base64 = "0.22"

# ── Cross-platform screen capture [DR-008, ADR-007] ──────────────────────────
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio-util = "0.7"

# ── Audio capture & playback [DR-005, ADR-008] ───────────────────────────────
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
zeroize = "1.8"

# ── Clipboard monitoring [DR-007] ───────────────────────────────────────────
arboard = "3.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
